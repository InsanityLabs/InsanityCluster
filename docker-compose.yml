services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: insanity_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insanity_cluster}
      POSTGRES_USER: ${POSTGRES_USER:-insanity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insanity_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insanity -d insanity_cluster"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Queue
  redis:
    image: redis:7-alpine
    container_name: insanity_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Exporter for Prometheus
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: insanity_postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://insanity:insanity_dev_password@postgres:5432/insanity_cluster?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres

  # Redis Exporter for Prometheus
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: insanity_redis_exporter
    environment:
      REDIS_ADDR: "redis:6379"
    ports:
      - "9121:9121"
    depends_on:
      - redis

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: insanity_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: insanity_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: insanity_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SURFACE Layer API
  surface:
    build:
      context: .
      dockerfile: Dockerfile.surface
    container_name: insanity_surface
    ports:
      - "5000:8000"
    environment:
      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-insanity_cluster}
      POSTGRES_USER: ${POSTGRES_USER:-insanity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insanity_dev_password}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      # API Settings
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_WORKERS: 1
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Security
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production}
      # AI Providers
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234}
    volumes:
      # Mount code for development (hot reload)
      - ./insanity_cluster:/app/insanity_cluster
      - ./alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  # INNER Layer Orchestrator
  inner:
    build:
      context: .
      dockerfile: Dockerfile.inner
    environment:
      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-insanity_cluster}
      POSTGRES_USER: ${POSTGRES_USER:-insanity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insanity_dev_password}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      # Settings
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # AI Providers
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234}
    volumes:
      # Mount code for development (hot reload)
      - ./insanity_cluster:/app/insanity_cluster
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      surface:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1

  # CRUST Layer Agent Workers
  crust:
    build:
      context: .
      dockerfile: Dockerfile.crust
    environment:
      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-insanity_cluster}
      POSTGRES_USER: ${POSTGRES_USER:-insanity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insanity_dev_password}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      # Agent Settings
      AGENT_TYPE: ${AGENT_TYPE:-all}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # AI Providers
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234}
      # External Service APIs
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
    volumes:
      # Mount code for development (hot reload)
      - ./insanity_cluster:/app/insanity_cluster
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      inner:
        condition: service_started
    restart: unless-stopped
    deploy:
      replicas: 2

  # Web Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: insanity_dashboard
    ports:
      - "3001:80"
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_WS_URL: ws://localhost:5000
    depends_on:
      surface:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: insanity_network
    driver: bridge
