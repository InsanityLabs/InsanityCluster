apiVersion: v1
kind: Service
metadata:
  name: surface-service
  namespace: insanity-cluster
  labels:
    app: surface
    layer: surface
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: surface
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: surface
  namespace: insanity-cluster
  labels:
    app: surface
    layer: surface
spec:
  replicas: 3
  selector:
    matchLabels:
      app: surface
  template:
    metadata:
      labels:
        app: surface
        layer: surface
    spec:
      containers:
      - name: surface
        image: insanity-cluster/surface:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        # ConfigMap values
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: ENVIRONMENT
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: DEBUG
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: LOG_LEVEL
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: POSTGRES_USER
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: REDIS_PORT
        - name: QDRANT_HOST
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: QDRANT_HOST
        - name: QDRANT_PORT
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: QDRANT_PORT
        - name: API_HOST
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: API_HOST
        - name: API_PORT
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: API_PORT
        - name: API_WORKERS
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: API_WORKERS
        # Secret values
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: insanity-cluster-secrets
              key: POSTGRES_PASSWORD
        - name: API_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: insanity-cluster-secrets
              key: API_SECRET_KEY
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: insanity-cluster-secrets
              key: OPENAI_API_KEY
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: insanity-cluster-secrets
              key: ANTHROPIC_API_KEY
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: insanity-cluster-secrets
              key: OPENROUTER_API_KEY
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: surface-hpa
  namespace: insanity-cluster
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: surface
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
