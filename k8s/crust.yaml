apiVersion: apps/v1
kind: Deployment
metadata:
  name: crust
  namespace: insanity-cluster
  labels:
    app: crust
    layer: crust
spec:
  replicas: 4
  selector:
    matchLabels:
      app: crust
  template:
    metadata:
      labels:
        app: crust
        layer: crust
    spec:
      containers:
      - name: crust
        image: insanity-cluster/crust:latest
        imagePullPolicy: Always
        env:
        # ConfigMap values
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: ENVIRONMENT
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: DEBUG
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: LOG_LEVEL
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: POSTGRES_USER
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: REDIS_PORT
        - name: QDRANT_HOST
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: QDRANT_HOST
        - name: QDRANT_PORT
          valueFrom:
            configMapKeyRef:
              name: insanity-cluster-config
              key: QDRANT_PORT
        - name: AGENT_TYPE
          value: "all"
        # Secret values
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: insanity-cluster-secrets
              key: POSTGRES_PASSWORD
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: insanity-cluster-secrets
              key: OPENAI_API_KEY
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: insanity-cluster-secrets
              key: ANTHROPIC_API_KEY
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: insanity-cluster-secrets
              key: OPENROUTER_API_KEY
        - name: TWILIO_ACCOUNT_SID
          valueFrom:
            secretKeyRef:
              name: insanity-cluster-secrets
              key: TWILIO_ACCOUNT_SID
        - name: TWILIO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: insanity-cluster-secrets
              key: TWILIO_AUTH_TOKEN
        - name: SENDGRID_API_KEY
          valueFrom:
            secretKeyRef:
              name: insanity-cluster-secrets
              key: SENDGRID_API_KEY
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command:
            - pgrep
            - -f
            - "python.*crust"
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: crust-hpa
  namespace: insanity-cluster
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: crust
  minReplicas: 4
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 60
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Min
