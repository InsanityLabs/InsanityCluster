# Docker Compose override for development
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # SURFACE Layer - Development overrides
  surface:
    build:
      context: .
      dockerfile: Dockerfile.surface
      target: base  # Use base stage for faster rebuilds
    command: >
      sh -c "pip install watchdog &&
             python -m uvicorn insanity_cluster.surface.main:app 
             --host 0.0.0.0 
             --port 8000 
             --reload 
             --reload-dir /app/insanity_cluster"
    environment:
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      API_WORKERS: 1
    volumes:
      # Mount entire codebase for hot reload
      - ./insanity_cluster:/app/insanity_cluster:rw
      - ./alembic:/app/alembic:rw
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./requirements.txt:/app/requirements.txt:ro

  # INNER Layer - Development overrides
  inner:
    build:
      context: .
      dockerfile: Dockerfile.inner
      target: base
    command: >
      sh -c "pip install watchdog &&
             watchmedo auto-restart 
             --directory=/app/insanity_cluster/inner 
             --pattern='*.py' 
             --recursive 
             -- python -m insanity_cluster.inner"
    environment:
      DEBUG: "true"
      LOG_LEVEL: DEBUG
    volumes:
      - ./insanity_cluster:/app/insanity_cluster:rw
      - ./pyproject.toml:/app/pyproject.toml:ro

  # CRUST Layer - Development overrides
  crust:
    build:
      context: .
      dockerfile: Dockerfile.crust
      target: base
    command: >
      sh -c "pip install watchdog &&
             watchmedo auto-restart 
             --directory=/app/insanity_cluster/crust 
             --pattern='*.py' 
             --recursive 
             -- python -m insanity_cluster.crust"
    environment:
      DEBUG: "true"
      LOG_LEVEL: DEBUG
    volumes:
      - ./insanity_cluster:/app/insanity_cluster:rw
      - ./pyproject.toml:/app/pyproject.toml:ro

  # Dashboard - Development overrides
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      target: builder  # Use builder stage for development
    command: npm run dev -- --host 0.0.0.0 --port 80
    volumes:
      - ./dashboard/src:/app/src:rw
      - ./dashboard/public:/app/public:rw
      - ./dashboard/index.html:/app/index.html:rw
      - ./dashboard/vite.config.ts:/app/vite.config.ts:ro
      - ./dashboard/tsconfig.json:/app/tsconfig.json:ro
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000

  # PostgreSQL - Development overrides
  postgres:
    ports:
      - "5432:5432"  # Expose for local development tools
    environment:
      POSTGRES_PASSWORD: insanity_dev_password  # Weak password OK for dev

  # Redis - Development overrides
  redis:
    ports:
      - "6379:6379"  # Expose for local development tools
    command: redis-server --appendonly yes --loglevel debug

  # Qdrant - Development overrides
  qdrant:
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    environment:
      QDRANT__LOG_LEVEL: DEBUG

  # Prometheus - Development overrides
  prometheus:
    ports:
      - "9090:9090"

  # Grafana - Development overrides
  grafana:
    ports:
      - "3000:3000"
    environment:
      GF_LOG_LEVEL: debug
      GF_SECURITY_ADMIN_PASSWORD: admin  # Weak password OK for dev

# Additional development services
  # Adminer - Database management UI
  adminer:
    image: adminer:latest
    container_name: insanity_adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    depends_on:
      - postgres
    restart: unless-stopped

  # Redis Commander - Redis management UI
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: insanity_redis_commander
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  # Mailhog - Email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: insanity_mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    restart: unless-stopped
