# NOTE: This is a template. In production, use sealed-secrets or external secrets management
# DO NOT commit actual secrets to version control
apiVersion: v1
kind: Secret
metadata:
  name: insanity-cluster-secrets
  namespace: insanity-cluster
type: Opaque
stringData:
  # Database Password
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # API Secret Key
  API_SECRET_KEY: "CHANGE_ME_IN_PRODUCTION"
  
  # AI Provider API Keys
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  OPENROUTER_API_KEY: ""
  
  # Communication Service API Keys
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  SENDGRID_API_KEY: ""
  
  # Grafana Admin Password
  GRAFANA_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
---
# Database URL constructed from components
apiVersion: v1
kind: Secret
metadata:
  name: database-url
  namespace: insanity-cluster
type: Opaque
stringData:
  DATABASE_URL: "postgresql://insanity:CHANGE_ME_IN_PRODUCTION@postgres-service:5432/insanity_cluster"
