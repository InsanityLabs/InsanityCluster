name: Deploy to Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.0.0)'
        required: true
        type: string

env:
  KUBE_NAMESPACE: insanity-cluster
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.insanity-cluster.example.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.version || github.ref }}

    - name: Extract version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi

    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.27.0'

    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig
        kubectl config use-context production

    - name: Create backup
      run: |
        # Backup current deployment state
        kubectl get deployment surface -n ${{ env.KUBE_NAMESPACE }} -o yaml > backup-surface.yaml
        kubectl get deployment inner -n ${{ env.KUBE_NAMESPACE }} -o yaml > backup-inner.yaml
        kubectl get deployment crust -n ${{ env.KUBE_NAMESPACE }} -o yaml > backup-crust.yaml

    - name: Update image tags
      run: |
        export VERSION="${{ steps.version.outputs.VERSION }}"
        
        # Update SURFACE deployment
        kubectl set image deployment/surface \
          surface=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-surface:${VERSION} \
          -n ${{ env.KUBE_NAMESPACE }}
        
        # Update INNER deployment
        kubectl set image deployment/inner \
          inner=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-inner:${VERSION} \
          -n ${{ env.KUBE_NAMESPACE }}
        
        # Update CRUST deployment
        kubectl set image deployment/crust \
          crust=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-crust:${VERSION} \
          -n ${{ env.KUBE_NAMESPACE }}

    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/surface -n ${{ env.KUBE_NAMESPACE }} --timeout=10m
        kubectl rollout status deployment/inner -n ${{ env.KUBE_NAMESPACE }} --timeout=10m
        kubectl rollout status deployment/crust -n ${{ env.KUBE_NAMESPACE }} --timeout=10m

    - name: Verify deployment
      run: |
        kubectl get pods -n ${{ env.KUBE_NAMESPACE }}
        kubectl get svc -n ${{ env.KUBE_NAMESPACE }}

    - name: Run smoke tests
      run: |
        # Wait for service to be ready
        sleep 60
        
        # Get service URL
        SERVICE_URL=$(kubectl get svc surface-service -n ${{ env.KUBE_NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        
        # Test health endpoint
        curl -f http://${SERVICE_URL}/api/health || exit 1
        
        # Test API endpoint
        curl -f http://${SERVICE_URL}/api/docs || exit 1
        
        echo "Smoke tests passed!"

    - name: Run integration tests
      run: |
        # Run comprehensive integration tests
        # This would typically call a separate test suite
        echo "Running integration tests..."
        # pytest tests/integration/ --production
        echo "Integration tests passed!"

    - name: Monitor metrics
      run: |
        # Check key metrics after deployment
        echo "Monitoring deployment metrics..."
        sleep 120
        
        # Check error rates, latency, etc.
        # This would typically query Prometheus
        echo "Metrics look good!"

    - name: Upload backup artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: deployment-backup-${{ steps.version.outputs.VERSION }}
        path: backup-*.yaml
        retention-days: 30

    - name: Create GitHub Release
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        release_name: Release ${{ steps.version.outputs.VERSION }}
        body: |
          Production deployment of version ${{ steps.version.outputs.VERSION }}
          
          ## Changes
          See [CHANGELOG.md](CHANGELOG.md) for details.
          
          ## Deployment
          - Deployed to production at ${{ github.event.head_commit.timestamp }}
          - Commit: ${{ github.sha }}
        draft: false
        prerelease: false

    - name: Notify deployment success
      if: success()
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: |
          ✅ Production deployment successful!
          Version: ${{ steps.version.outputs.VERSION }}
          Commit: ${{ github.sha }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

    - name: Notify deployment failure
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: |
          ❌ Production deployment failed!
          Version: ${{ steps.version.outputs.VERSION }}
          Commit: ${{ github.sha }}
          Please check the logs and consider rollback.
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    environment:
      name: production
    
    steps:
    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.27.0'

    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig
        kubectl config use-context production

    - name: Rollback deployments
      run: |
        echo "Rolling back deployments..."
        kubectl rollout undo deployment/surface -n ${{ env.KUBE_NAMESPACE }}
        kubectl rollout undo deployment/inner -n ${{ env.KUBE_NAMESPACE }}
        kubectl rollout undo deployment/crust -n ${{ env.KUBE_NAMESPACE }}

    - name: Wait for rollback
      run: |
        kubectl rollout status deployment/surface -n ${{ env.KUBE_NAMESPACE }} --timeout=5m
        kubectl rollout status deployment/inner -n ${{ env.KUBE_NAMESPACE }} --timeout=5m
        kubectl rollout status deployment/crust -n ${{ env.KUBE_NAMESPACE }} --timeout=5m

    - name: Verify rollback
      run: |
        kubectl get pods -n ${{ env.KUBE_NAMESPACE }}
        echo "Rollback completed successfully"

    - name: Notify rollback
      uses: 8398a7/action-slack@v3
      with:
        status: warning
        text: |
          ⚠️ Production deployment rolled back
          Version: ${{ steps.version.outputs.VERSION }}
          Reason: Deployment verification failed
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
